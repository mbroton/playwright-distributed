version: 2
updates:
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "worker"]
    assignees: ["mbroton"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
  - package-ecosystem: docker
    directory: "/worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies", "worker"]
    assignees: ["mbroton"]
    commit-message:
      prefix: "chore"
      include: "scope"
