version: 2

multi-ecosystem-groups:
  playwright:
    schedule:
      interval: weekly
    # Shared options must live on the group, not on its member updates;
    # Dependabot rejects the whole config otherwise.
    open-pull-requests-limit: 10
    labels: ["dependencies", "worker"]
    assignees: ["mbroton"]
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  # Playwright's package and runtime image must change in the same pull request.
  - package-ecosystem: npm
    directory: "/worker"
    patterns: ["playwright-core"]
    multi-ecosystem-group: playwright
  - package-ecosystem: docker
    directory: "/worker"
    patterns: ["playwright"]
    multi-ecosystem-group: playwright
  - package-ecosystem: gomod
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "server"]
    assignees: ["mbroton"]
    commit-message:
      prefix: "chore"
      include: "scope"
