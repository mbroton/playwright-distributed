name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# A release must not be cancelled between the two image pushes. The called
# ci.yml cancels its own group, and its group name resolves with this
# workflow's name, so keep this name clearly different from `Release-<ref>`.
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag is a semantic version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a semantic version, for example v1.2.3" >&2
            exit 1
          fi

      - name: Verify the tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit on main" >&2
            echo "Only reviewed commits that passed the required checks can be released" >&2
            exit 1
          fi

  # Runs the full CI suite against the tagged commit. Calling ci.yml keeps the
  # release checks equal to the pull request checks.
  checks:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  build:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install smoke test dependencies
        working-directory: ./worker
        run: npm ci

      # Both images are built for both platforms before anything is pushed, so
      # a build failure cannot leave one image published without the other.
      - name: Build server for all release platforms
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-to: type=gha,mode=max,scope=server
          cache-from: type=gha,scope=server

      - name: Build worker for all release platforms
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-to: type=gha,mode=max,scope=worker
          cache-from: type=gha,scope=worker

      # docker-compose.yaml is the documented deployment path and pins the
      # `latest` tags, so the smoke test loads the built images under those
      # names and runs that file unchanged. The compose file hardcodes the
      # upstream image names, so in a fork these tags diverge from
      # `github.repository` and this smoke test fails until both match.
      - name: Load the amd64 images under their deployment tags
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          load: true
          platforms: linux/amd64
          cache-from: type=gha,scope=server
          tags: ghcr.io/${{ github.repository }}/server:latest

      - name: Load the amd64 worker image under its deployment tag
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          load: true
          platforms: linux/amd64
          cache-from: type=gha,scope=worker
          tags: ghcr.io/${{ github.repository }}/worker:latest

      # A visitor runs the quick start from an empty directory that holds only
      # the files the README tells them to download. Mirror that layout so a
      # compose file that references anything else fails here, not for them.
      # Keep this list equal to the README quick start.
      - name: Stage the quick-start files as a visitor would have them
        run: |
          mkdir -p "$RUNNER_TEMP/quick-start/worker"
          cp docker-compose.yaml "$RUNNER_TEMP/quick-start/"
          cp worker/seccomp_profile.json "$RUNNER_TEMP/quick-start/worker/"

      # `--pull never` guards the ghcr images: the deployment must use the
      # images built above, never ones already published. It also blocks
      # third-party images, which a fresh runner does not have, so pull
      # those explicitly first.
      - name: Pull images not built from this repository
        working-directory: ${{ runner.temp }}/quick-start
        run: docker compose pull postgres

      - name: Start the documented deployment
        working-directory: ${{ runner.temp }}/quick-start
        run: docker compose up -d --pull never

      - name: Smoke-test the release images
        working-directory: ./worker
        run: |
          for _ in {1..15}; do
            if WS_ENDPOINT=ws://127.0.0.1:8080 npm run smoke; then
              exit 0
            fi
            sleep 2
          done

          echo "The release images did not pass the smoke test" >&2
          exit 1

      - name: Show service logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/quick-start
        run: docker compose logs

      - name: Stop the deployment
        if: always()
        working-directory: ${{ runner.temp }}/quick-start
        run: docker compose down

  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          # `latest=auto` keeps a pre-release tag from moving `latest`.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Docker meta (worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/worker
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Both builds are cache hits from the build job, so these steps only push
      # the layers. The two images therefore reach the registry seconds apart.
      - name: Push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=server
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Push worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=worker
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
