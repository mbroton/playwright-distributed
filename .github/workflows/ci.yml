name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  # release.yml runs this suite against the tagged commit.
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Playwright versions stay in sync
        run: node scripts/check-playwright-version.js

  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: ./worker
        run: npm ci

      - name: Type-check worker
        working-directory: ./worker
        run: npm run typecheck

      - name: Test worker
        working-directory: ./worker
        run: npm test

  proxy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: proxy/go.sum

      - name: Vet proxy
        working-directory: ./proxy
        run: go vet ./...

      - name: Run proxy unit tests with race detection
        working-directory: ./proxy
        run: go test -race -v ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan proxy for reachable vulnerabilities
        working-directory: ./proxy
        run: govulncheck ./...

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Verify generated server and API client code
        run: |
          cd server
          make generate
          make openapi
          cd ../worker
          npm ci
          npm run generate:api
          cd ..
          git add -A
          git diff --cached --exit-code

      - name: Vet server
        working-directory: ./server
        run: go vet ./...

      - name: Run server tests with race detection
        working-directory: ./server
        run: go test -race -v ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan server for reachable vulnerabilities
        working-directory: ./server
        run: govulncheck ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build proxy (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: false
          platforms: linux/amd64

      - name: Build server (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          platforms: linux/amd64

      - name: Build worker (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: false
          platforms: linux/amd64

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install smoke test dependencies
        working-directory: ./worker
        run: npm ci

      - name: Start server and browser workers
        run: docker compose -f docker-compose.local.yaml up -d --build

      - name: Verify workers run as non-root
        run: |
          for service in worker worker-firefox worker-webkit; do
            if [[ "$(docker compose -f docker-compose.local.yaml exec -T "$service" id -u)" == "0" ]]; then
              echo "$service is running as root" >&2
              exit 1
            fi
          done

          if docker compose -f docker-compose.local.yaml exec -T worker \
            sh -c 'ps -eo args | grep "[c]hrome-headless-shell .*--no-sandbox"'; then
            echo "Chromium is running without its sandbox" >&2
            exit 1
          fi

      - name: Run browser smoke tests
        working-directory: ./worker
        run: |
          for browser in chromium firefox webkit; do
            endpoint="ws://127.0.0.1:8080"
            if [[ "$browser" != "chromium" ]]; then
              endpoint="$endpoint?browser=$browser"
            fi

            passed=false
            for attempt in {1..10}; do
              if BROWSER_TYPE="$browser" WS_ENDPOINT="$endpoint" npm run smoke; then
                passed=true
                break
              fi
              sleep 2
            done

            if [[ "$passed" != "true" ]]; then
              echo "$browser smoke test did not pass" >&2
              exit 1
            fi
          done

      - name: Verify worker drains on stop
        run: |
          docker compose -f docker-compose.local.yaml stop -t 55 worker
          container_id="$(docker compose -f docker-compose.local.yaml ps -aq worker)"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" -eq 0
          docker compose -f docker-compose.local.yaml logs worker | grep -q 'Worker is draining'

      - name: Verify worker scaling
        run: |
          docker compose -f docker-compose.local.yaml up -d --scale worker=3
          sleep 10
          workers="$(curl -fsS http://127.0.0.1:8080/v1/capacity | jq '[.browsers[] | select(.browser == "chromium")][0].workers // 0')"
          test "$workers" -eq 3

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yaml logs

      - name: Stop integration services
        if: always()
        run: docker compose -f docker-compose.local.yaml down
