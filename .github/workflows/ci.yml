name: CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Playwright versions stay in sync
        run: node scripts/check-playwright-version.js

  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: ./worker
        run: npm ci

      - name: Type-check worker
        working-directory: ./worker
        run: npm run typecheck

      - name: Test worker
        working-directory: ./worker
        run: npm test

  proxy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: proxy/go.sum

      - name: Vet proxy
        working-directory: ./proxy
        run: go vet ./...

      - name: Run proxy unit tests with race detection
        working-directory: ./proxy
        run: go test -race -v ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan proxy for reachable vulnerabilities
        working-directory: ./proxy
        run: govulncheck ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build proxy (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: false
          platforms: linux/amd64

      - name: Build worker (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: false
          platforms: linux/amd64

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install smoke test dependencies
        working-directory: ./worker
        run: npm ci

      - name: Start Redis
        run: docker compose -f docker-compose.local.yaml up -d redis

      - name: Wait for Redis
        run: |
          for attempt in {1..30}; do
            if docker compose -f docker-compose.local.yaml exec -T redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Start proxy and browser workers
        run: docker compose -f docker-compose.local.yaml up -d --build proxy worker worker-firefox worker-webkit

      - name: Verify workers run as non-root
        run: |
          for service in worker worker-firefox worker-webkit; do
            if [[ "$(docker compose -f docker-compose.local.yaml exec -T "$service" id -u)" == "0" ]]; then
              echo "$service is running as root" >&2
              exit 1
            fi
          done

          if docker compose -f docker-compose.local.yaml exec -T worker \
            sh -c 'ps -eo args | grep "[c]hrome-headless-shell .*--no-sandbox"'; then
            echo "Chromium is running without its sandbox" >&2
            exit 1
          fi

      - name: Verify Redis key TTL controls worker liveness
        working-directory: ./worker
        run: |
          redis=(docker compose -f ../docker-compose.local.yaml exec -T redis redis-cli --raw)
          worker_id=chromium:selector-test
          worker_key=worker:$worker_id

          "${redis[@]}" hset "$worker_key" \
            status available browserType chromium lastHeartbeat 0 >/dev/null
          "${redis[@]}" expire "$worker_key" 60 >/dev/null
          "${redis[@]}" hset cluster:active_connections "$worker_id" 0 >/dev/null
          "${redis[@]}" hset cluster:lifetime_connections "$worker_id" 1 >/dev/null

          selector=$(<../proxy/internal/redis/selector.lua)
          selected=$("${redis[@]}" eval "$selector" 0 5 100 chromium)

          if [[ "$selected" != "$worker_id" ]]; then
            echo "Expected $worker_id, selected ${selected:-none}" >&2
            exit 1
          fi

          "${redis[@]}" persist "$worker_key" >/dev/null
          "${redis[@]}" hset cluster:active_connections "$worker_id" 0 >/dev/null
          "${redis[@]}" hset cluster:lifetime_connections "$worker_id" 1 >/dev/null
          selected_without_ttl=$("${redis[@]}" eval "$selector" 0 5 100 chromium)

          "${redis[@]}" del "$worker_key" >/dev/null
          "${redis[@]}" hdel cluster:active_connections "$worker_id" >/dev/null
          "${redis[@]}" hdel cluster:lifetime_connections "$worker_id" >/dev/null

          if [[ "$selected_without_ttl" == "$worker_id" ]]; then
            echo "Selected persistent worker key $worker_id" >&2
            exit 1
          fi

      - name: Run Redis-backed browser smoke tests
        working-directory: ./worker
        run: |
          for browser in chromium firefox webkit; do
            endpoint="ws://127.0.0.1:8080"
            if [[ "$browser" != "chromium" ]]; then
              endpoint="$endpoint?browser=$browser"
            fi

            passed=false
            for attempt in {1..10}; do
              if BROWSER_TYPE="$browser" WS_ENDPOINT="$endpoint" npm run smoke; then
                passed=true
                break
              fi
              sleep 2
            done

            if [[ "$passed" != "true" ]]; then
              echo "$browser smoke test did not pass" >&2
              exit 1
            fi
          done

      - name: Test worker Redis resilience
        run: scripts/test/worker-redis-resilience.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yaml logs

      - name: Stop integration services
        if: always()
        run: docker compose -f docker-compose.local.yaml down
