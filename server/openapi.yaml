components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    HeartbeatInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HeartbeatInputBody.json
          format: uri
          readOnly: true
          type: string
        active_session_ids:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    HeartbeatOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HeartbeatOutputBody.json
          format: uri
          readOnly: true
          type: string
        commands:
          items:
            type: string
          type: array
        status:
          enum:
            - available
            - draining
            - stalled
            - shutting_down
          type: string
      required:
        - status
        - commands
      type: object
    RegisterWorkerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RegisterWorkerInputBody.json
          format: uri
          readOnly: true
          type: string
        address:
          format: uri
          type: string
        browser:
          enum:
            - chromium
            - firefox
            - webkit
          type: string
        max_slots:
          format: int32
          minimum: 1
          type: integer
        playwright_version:
          minLength: 1
          type: string
      required:
        - address
        - browser
        - playwright_version
        - max_slots
      type: object
    Session:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Session.json
          format: uri
          readOnly: true
          type: string
        browser:
          type: string
        connect_metadata:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        created_by_key:
          format: uuid
          type: string
        expires_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        keep_alive_ms:
          format: int32
          type: integer
        last_heartbeat:
          format: date-time
          type: string
        mode:
          enum:
            - default
            - dedicated
          type: string
        playwright_version:
          type: string
        status:
          enum:
            - pending
            - running
            - completed
            - failed
            - expired
          type: string
        worker_address:
          type: string
        worker_id:
          format: uuid
          type: string
      required:
        - id
        - worker_id
        - browser
        - playwright_version
        - worker_address
        - mode
        - status
        - created_at
        - last_heartbeat
        - connect_metadata
      type: object
    SetStatusInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SetStatusInputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          enum:
            - draining
            - shutting_down
          type: string
      required:
        - status
      type: object
    Worker:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Worker.json
          format: uri
          readOnly: true
          type: string
        address:
          type: string
        browser:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        last_heartbeat:
          format: date-time
          type: string
        lifetime_sessions:
          format: int64
          type: integer
        max_slots:
          format: int32
          type: integer
        playwright_version:
          type: string
        status:
          enum:
            - available
            - draining
            - stalled
            - shutting_down
          type: string
      required:
        - id
        - address
        - browser
        - playwright_version
        - max_slots
        - status
        - last_heartbeat
        - lifetime_sessions
        - created_at
      type: object
  securitySchemes:
    bearer:
      bearerFormat: pwd_<random>
      scheme: bearer
      type: http
info:
  title: Playwright Distributed Control Plane
  version: 1.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check process health
      tags:
        - Infrastructure
  /internal/workers:
    post:
      operationId: register-worker
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkerInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Register a worker
      tags:
        - Workers
  /internal/workers/{id}/heartbeat:
    post:
      operationId: heartbeat-worker
      parameters:
        - description: Worker ID
          in: path
          name: id
          required: true
          schema:
            description: Worker ID
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Heartbeat a worker
      tags:
        - Workers
  /internal/workers/{id}/status:
    post:
      operationId: set-worker-status
      parameters:
        - description: Worker ID
          in: path
          name: id
          required: true
          schema:
            description: Worker ID
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Request a worker status transition
      tags:
        - Workers
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Check database readiness
      tags:
        - Infrastructure
  /v1/sessions/{id}:
    get:
      operationId: get-session
      parameters:
        - description: Session ID
          in: path
          name: id
          required: true
          schema:
            description: Session ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Get a session
      tags:
        - Sessions
  /v1/workers:
    get:
      operationId: list-workers
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Worker"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List workers
      tags:
        - Workers
