services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Set POSTGRES_PASSWORD in a .env file before any real deployment.
      # PostgreSQL reads it only when the postgres-data volume is first
      # created; changing it later requires resetting the volume.
      # The database stores sessions, workers, and API-key hashes.
      - POSTGRES_USER=pwd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pwd}
      - POSTGRES_DB=pwd
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwd -d pwd"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  server:
    image: ghcr.io/mbroton/playwright-distributed/server:latest
    environment:
      # A server with zero API keys runs in unauthenticated bootstrap mode.
      # Create the first key: docker compose exec server server apikey create --name <name>
      # Creating a key locks the whole API, so hand the key to every worker
      # (WORKER_API_KEY below) and client in the same step.
      - DATABASE_URL=postgres://pwd:${POSTGRES_PASSWORD:-pwd}@postgres:5432/pwd?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    # Must exceed the server's shutdown sequence (~44s with the default
    # SHUTDOWN_GRACE_PERIOD and WORKER_DIAL_TIMEOUT); raise them together.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/mbroton/playwright-distributed/worker:latest
    init: true
    security_opt:
      - seccomp=./worker/seccomp_profile.json
    shm_size: "1gb"
    stop_grace_period: 60s
    environment:
      - SERVER_URL=http://server:8080
      # Supported values: chromium, firefox, webkit
      - BROWSER_TYPE=chromium
      # Port for browser relay connections
      - PORT=3131
      # Maximum number of concurrent browser sessions
      - MAX_SLOTS=5
      # Max seconds to wait for open sessions on SIGTERM. Raise together with
      # stop_grace_period: grace must stay above DRAIN_TIMEOUT + 20s cleanup.
      - DRAIN_TIMEOUT=30
      # Required as soon as the server has an API key (see the server comment).
      - WORKER_API_KEY=${WORKER_API_KEY:-}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
