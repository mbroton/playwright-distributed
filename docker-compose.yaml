services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=pwd
      - POSTGRES_PASSWORD=pwd
      - POSTGRES_DB=pwd
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwd -d pwd"]
      interval: 2s
      timeout: 2s
      retries: 30

  server:
    image: ghcr.io/mbroton/playwright-distributed/server:latest
    environment:
      # A server with zero API keys runs in unauthenticated bootstrap mode.
      # Create the first key: docker compose exec server server apikey create --name <name>
      - DATABASE_URL=postgres://pwd:pwd@postgres:5432/pwd?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  # Stop budget: each cleanup step is bounded by the worker's 2.5s cleanup
  # timeout, not its inner deadline. Worst case: 2.5s drain status + 30s drain
  # + 2.5s shutdown status + 2.5s gateway + 10s browser close + 2.5s kill = 50s.
  worker:
    image: ghcr.io/mbroton/playwright-distributed/worker:latest
    init: true
    security_opt:
      - seccomp=./worker/seccomp_profile.json
    shm_size: "1gb"
    stop_grace_period: 60s
    environment:
      - SERVER_URL=http://server:8080
      # Supported values: chromium, firefox, webkit
      - BROWSER_TYPE=chromium
      # Port for browser relay connections
      - PORT=3131
      # Maximum number of concurrent browser sessions
      - MAX_SLOTS=5
      # Max seconds to wait for open sessions on SIGTERM. Raise together with
      # stop_grace_period: grace must stay above DRAIN_TIMEOUT + 20s cleanup.
      - DRAIN_TIMEOUT=30
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
