services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=pwd
      - POSTGRES_PASSWORD=pwd
      - POSTGRES_DB=pwd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwd -d pwd"]
      interval: 2s
      timeout: 2s
      retries: 30

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      # Local Compose uses unauthenticated bootstrap mode. Do not use it on a public network.
      - DATABASE_URL=postgres://pwd:pwd@postgres:5432/pwd?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    init: true
    security_opt:
      - seccomp=./worker/seccomp_profile.json
    shm_size: "1gb"
    environment:
      - SERVER_URL=http://server:8080
      # Supported values: chromium, firefox, webkit
      - BROWSER_TYPE=chromium
      # Port for browser relay connections
      - PORT=3131
      - LOG_FORMAT=text
      # Maximum number of concurrent browser sessions
      - MAX_SLOTS=5
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  worker-firefox:
    build:
      context: ./worker
      dockerfile: Dockerfile
    init: true
    security_opt:
      - seccomp=./worker/seccomp_profile.json
    shm_size: "1gb"
    environment:
      - SERVER_URL=http://server:8080
      - BROWSER_TYPE=firefox
      # Port for browser relay connections
      - PORT=3131
      - LOG_FORMAT=text
      # Maximum number of concurrent browser sessions
      - MAX_SLOTS=5
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  worker-webkit:
    build:
      context: ./worker
      dockerfile: Dockerfile
    init: true
    security_opt:
      - seccomp=./worker/seccomp_profile.json
    shm_size: "1gb"
    environment:
      - SERVER_URL=http://server:8080
      - BROWSER_TYPE=webkit
      # Port for browser relay connections
      - PORT=3131
      - LOG_FORMAT=text
      # Maximum number of concurrent browser sessions
      - MAX_SLOTS=5
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
